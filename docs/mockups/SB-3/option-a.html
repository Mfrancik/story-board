      <div class="divide-y divide-zinc-100 dark:divide-zinc-800">${rows.length ? rows.slice(0, 10).map(r => row(r, g.key)).join('') + (rows.length > 10 ? `<button class="w-full px-3 py-2 text-left text-sm text-zinc-500 hover:text-zinc-900 dark:hover:text-white">Show ${rows.length - 10} more</button>` : '') : empty(g.emptyText)}</div></section>`; }).join('');
  document.getElementById('app').innerHTML = header() + filters('mt-4') + `<div class="mt-4 space-y-4">${groups}</div>
    <h2 class="mt-8 text-sm font-semibold uppercase tracking-wide text-zinc-500">Projects</h2>
    <div class="mt-2 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">${D.projects.map(p => projectCard(p)).join('')}</div>`;
}
render();</script></body></html>
